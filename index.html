
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Online Shopping</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #172554;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  font-size: 30px;
}

header p {
  margin-top: 6px;
}

.search {
  padding: 15px;
  text-align: center;
  background: white;
}

.search input {
  width: 90%;
  max-width: 500px;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

.categories {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px;
}

.categories button {
  padding: 10px 18px;
  border: none;
  background: #172554;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

h2 {
  text-align: center;
  margin: 20px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 15px;
  padding: 15px;
}

.product {
  background: white;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 2px 8px #ddd;
}

.product img {
  width: 100%;
  height: 140px;
  object-fit: cover;
  border-radius: 8px;
}

.product h3 {
  margin: 10px 0;
}

.product p {
  color: #15803d;
  font-weight: bold;
  margin: 8px;
}

.product button, .checkout button {
  background: #172554;
  color: white;
  padding: 10px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  width: 100%;
}

.cart {
  background: white;
  margin: 15px;
  padding: 20px;
  border-radius: 10px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #ddd;
}

.cart-item button {
  padding: 4px 8px;
}

.checkout {
  background: white;
  margin: 15px;
  padding: 20px;
  border-radius: 10px;
}

.checkout input, .checkout textarea,
.checkout select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
}

footer {
  background: #172554;
  color: white;
  text-align: center;
  padding: 20px;
  margin-top: 25px;
}
</style>
</head>

<body>

<header>
  <h1>ShopEase</h1>
  <p>Your Shopping, Your Happiness!</p>
</header>

<div class="search">
  <input type="text" id="search"
  placeholder="Search your products..."
  oninput="showProducts()">
</div>

<div class="categories">
  <button onclick="setCategory('All')">All</button>
  <button onclick="setCategory('Fashion')">Fashion</button>
  <button onclick="setCategory('Electronics')">Electronics</button>
  <button onclick="setCategory('Home')">Home</button>
</div>

<h2>Our Products</h2>
<div class="products" id="products"></div>

<h2>Shopping Cart 🛒</h2>
<div class="cart">
  <div id="cartItems">Your cart is empty.</div>
  <h3 id="total">Total: ₹0</h3>
</div>

<h2>Checkout</h2>
<div class="checkout">
  <form id="checkoutForm">
    <input id="customerName" type="text"
      placeholder="Your Name" required>

    <input id="phone" type="tel"
      placeholder="Mobile Number" required>

    <textarea id="address"
      placeholder="Delivery Address" required></textarea>

    <select id="payment">
      <option value="Cash on Delivery">Cash on Delivery</option>
      <option value="Online Payment (Demo)">Online Payment (Demo)</option>
    </select>

    <button type="submit">Place Demo Order</button>
  </form>
  <p id="message"></p>
</div>

<footer>
  <h3>ShopEase</h3>
  <p>Online Shopping Made Easy</p>
  <p>Contact: support@shopease.example</p>
  <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script>
const productsData = [
  {
    id: 1,
    name: "Stylish T-Shirt",
    price: 499,
    category: "Fashion",
    image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
  },
  {
    id: 2,
    name: "Smart Watch",
    price: 1299,
    category: "Electronics",
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
  },
  {
    id: 3,
    name: "Headphones",
    price: 899,
    category: "Electronics",
    image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
  },
  {
    id: 4,
    name: "Shoes",
    price: 999,
    category: "Fashion",
    image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
  },
  {
    id: 5,
    name: "Home Decor",
    price: 699,
    category: "Home",
    image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=500"
  },
  {
    id: 6,
    name: "Backpack",
    price: 799,
    category: "Fashion",
    image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
  }
];

let cart = [];
let selectedCategory = "All";

function showProducts() {
  const search = document.getElementById("search")
    .value.toLowerCase();

  const filtered = productsData.filter(product => {
    const matchSearch =
      product.name.toLowerCase().includes(search);

    const matchCategory =
      selectedCategory === "All" ||
      product.category === selectedCategory;

    return matchSearch && matchCategory;
  });

  const container = document.getElementById("products");
  container.innerHTML = "";

  filtered.forEach(product => {
    container.innerHTML += `
      <div class="product">
        <img src="${product.image}" alt="${product.name}">
        <h3>${product.name}</h3>
        <p>₹${product.price}</p>
        <button onclick="addToCart(${product.id})">
          Add to Cart
        </button>
      </div>
    `;
  });

  if (filtered.length === 0) {
    container.innerHTML = "<p>No products found.</p>";
  }
}

function setCategory(category) {
  selectedCategory = category;
  showProducts();
}

function addToCart(id) {
  const item = cart.find(product => product.id === id);

  if (item) {
    item.quantity++;
  } else {
    const product = productsData.find(p => p.id === id);
    cart.push({...product, quantity: 1});
  }

  updateCart();
}

function updateCart() {
  const container = document.getElementById("cartItems");
  const totalElement = document.getElementById("total");

  if (cart.length === 0) {
    container.innerHTML = "Your cart is empty.";
  } else {
    container.innerHTML = cart.map(item => `
      <div class="cart-item">
        <span>${item.name} × ${item.quantity}</span>
        <span>
          ₹${item.price * item.quantity}
          <button onclick="removeItem(${item.id})">−</button>
          <button onclick="addToCart(${item.id})">+</button>
        </span>
      </div>
    `).join("");
  }

  const total = cart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  totalElement.innerText = "Total: ₹" + total;
}

function removeItem(id) {
  const item = cart.find(product => product.id === id);

  if (item) {
    item.quantity--;

    if (item.quantity <= 0) {
      cart = cart.filter(product => product.id !== id);
    }
  }

  updateCart();
}

document.getElementById("checkoutForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  if (cart.length === 0) {
    alert("Please add products to your cart first.");
    return;
  }

  const name = document.getElementById("customerName").value;
  const payment = document.getElementById("payment").value;

  document.getElementById("message").innerText =
    "Demo order received for " + name +
    ". Payment: " + payment +
    ". No real payment or order processing is connected.";

  cart = [];
  updateCart();
  this.reset();
});

showProducts();
updateCart();
</script>

</body>
      </html>
